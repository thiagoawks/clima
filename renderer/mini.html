<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'">
<title>Clima mini</title>
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/300.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/400.css">
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/500.css">
<link rel="stylesheet" href="styles.css">
<style>
body { background: var(--card); -webkit-app-region: drag; }
.mini { height: 100%; padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; }
.mini button { -webkit-app-region: no-drag; }
.m-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.m-name { font-size: 15px; font-weight: 500; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-sub { font-size: 12px; color: var(--muted); }
.m-x { width: 22px; height: 22px; border-radius: 50%; color: var(--muted); display: grid; place-items: center; flex: none; }
.m-x:hover { background: var(--soft); color: var(--ink); }
.m-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.m-temp { font-size: 34px; font-weight: 300; line-height: 1; min-width: 62px; }
.m-temp.off { color: var(--faint); }
.m-btns { display: flex; gap: 8px; align-items: center; }
.m-round { width: 36px; height: 36px; border-radius: 50%; background: var(--soft); font-size: 20px; font-weight: 300; display: grid; place-items: center; }
.m-round:hover:not(:disabled) { background: var(--soft-hover); }
</style>
</head>
<body>
<div class="mini" id="mini"></div>
<script src="mini.js"></script>
</body>
</html>
