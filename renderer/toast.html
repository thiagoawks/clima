<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Clima</title>
<link rel="stylesheet" href="../node_modules/@fontsource/outfit/500.css">
<style>
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
body { display: grid; place-items: center; font-family: 'Outfit', 'Segoe UI', sans-serif; }
#t { background: rgba(28, 28, 30, .94); color: #F5F5F7; border-radius: 999px; padding: 12px 22px; font-size: 17px; font-weight: 500; white-space: nowrap; }
</style>
</head>
<body>
<div id="t" role="status"></div>
<script>
const show = () => { document.getElementById('t').textContent = decodeURIComponent(location.hash.slice(1)); };
addEventListener('hashchange', show);
show();
</script>
</body>
</html>
